<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Cup 2026 Sweepstake</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2234;
    --border: #2a3a54;
    --accent: #f59e0b;
    --accent2: #3b82f6;
    --text: #f0f4ff;
    --text-muted: #8899aa;
    --green: #22c55e;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 16px;
  }

  /* ─── Header ─── */
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  header h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f59e0b, #ef4444, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--text-muted);
    margin-top: 6px;
    font-size: 0.95rem;
  }

  /* ─── Screens ─── */
  .screen { width: 100%; max-width: 560px; display: none; }
  .screen.active { display: block; }

  /* ─── Cards ─── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ─── Textarea ─── */
  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    padding: 12px 14px;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
    min-height: 140px;
    font-family: inherit;
  }
  textarea:focus { border-color: var(--accent2); }
  textarea::placeholder { color: var(--text-muted); }

  /* ─── Buttons ─── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-primary {
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #000;
    box-shadow: 0 4px 16px rgba(245,158,11,0.3);
  }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 24px rgba(245,158,11,0.5); }

  .btn-blue {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: #fff;
    box-shadow: 0 4px 16px rgba(59,130,246,0.3);
  }
  .btn-blue:hover:not(:disabled) { box-shadow: 0 6px 24px rgba(59,130,246,0.5); }

  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled) { color: var(--text); border-color: var(--text-muted); }

  .btn-danger {
    background: transparent;
    color: #ef4444;
    border: 1px solid #ef4444;
  }
  .btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.1); }

  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .btn-row .btn { flex: 1; min-width: 120px; }

  /* ─── Error ─── */
  .error-msg {
    color: #ef4444;
    font-size: 0.85rem;
    margin-top: 8px;
    min-height: 20px;
  }

  /* ─── Reveal screen ─── */
  #screen-reveal { max-width: 640px; }

  .pot-indicator {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    transition: color 0.4s;
  }
  .pot-indicator.spotlight { color: var(--accent); }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  /* ─── Flip card ─── */
  .flip-card-wrap {
    margin-bottom: 20px;
  }

  .reveal-card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 40px 24px;
    text-align: center;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: transform 0.35s ease, opacity 0.35s ease, border-color 0.4s, box-shadow 0.4s;
    user-select: none;
    position: relative;
  }

  /* animation: scale+fade (default) */
  .reveal-card.anim-exit-scale {
    transform: scale(0.96);
    opacity: 0;
  }
  /* animation: slide up */
  .reveal-card.anim-exit-slide {
    transform: translateY(-14px);
    opacity: 0;
  }
  /* animation: wipe (clip-path) */
  .reveal-card.anim-exit-wipe {
    clip-path: inset(0 0 100% 0);
    opacity: 0;
  }
  /* animation: fade */
  .reveal-card.anim-exit-fade {
    opacity: 0;
  }

  /* Style picker */
  .anim-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .anim-picker span {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .anim-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 0.75rem;
    font-weight: 600;
    padding: 4px 10px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    letter-spacing: 0.3px;
  }
  .anim-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .anim-btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(59,130,246,0.08); }

  .owner-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 2.2em;
    margin-top: 4px;
  }

  .owner-redacted {
    width: 140px;
    height: 1.1em;
    border-radius: 99px;
    background: var(--border);
    position: absolute;
    opacity: 1;
    transition: opacity 0.5s ease;
  }

  .owner-name {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    font-weight: 600;
    color: var(--accent);
    position: absolute;
    opacity: 0;
    transition: opacity 0.5s ease;
    white-space: nowrap;
  }

  .owner-wrap.revealed .owner-redacted { opacity: 0; }
  .owner-wrap.revealed .owner-name    { opacity: 1; }

  .reveal-card.spotlight-card {
    border-color: var(--accent);
    box-shadow: 0 0 40px rgba(245,158,11,0.25), 0 0 80px rgba(245,158,11,0.1);
  }

  .reveal-flag {
    font-size: clamp(3.5rem, 12vw, 6rem);
    line-height: 1;
    transition: font-size 0.4s;
  }

  .reveal-country {
    font-size: clamp(1.6rem, 6vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }


  .reveal-hint {
    font-size: 0.78rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 8px;
  }

  .reveal-placeholder {
    font-size: 3rem;
    opacity: 0.2;
  }

  .spotlight-badge {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #000;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 99px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .reveal-card.spotlight-card .spotlight-badge { opacity: 1; }

  .progress-label {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.82rem;
    margin-bottom: 16px;
  }

  /* ─── Results screen ─── */
  #screen-results { max-width: 720px; }

  .results-banner {
    text-align: center;
    padding: 32px 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 24px;
  }
  .results-banner h2 {
    font-size: clamp(1.8rem, 6vw, 3rem);
    font-weight: 900;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .results-banner p { color: var(--text-muted); }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .player-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: border-color 0.2s;
  }
  .player-card:first-child { border-color: var(--accent); }
  .player-card:first-child .player-rank { color: var(--accent); }

  .player-rank {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .player-name {
    font-size: 1.2rem;
    font-weight: 800;
    margin-bottom: 14px;
    color: var(--text);
  }
  .team-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .team-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.92rem;
    color: var(--text-muted);
  }
  .team-list li span.flag { font-size: 1.2rem; }
  .team-list li span.name { color: var(--text); }
  .team-list li .rank-badge {
    margin-left: auto;
    font-size: 0.7rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    color: var(--text-muted);
  }

  /* ─── Fullscreen enhancements ─── */
  :fullscreen body,
  :-webkit-full-screen body {
    padding: 40px 32px;
  }
  :fullscreen .reveal-flag,
  :-webkit-full-screen .reveal-flag { font-size: 9rem; }
  :fullscreen .reveal-country,
  :-webkit-full-screen .reveal-country { font-size: 4rem; }
  :fullscreen .owner-name,
  :-webkit-full-screen .owner-name { font-size: 2.4rem; }
  :fullscreen .owner-redacted,
  :-webkit-full-screen .owner-redacted { width: 200px; height: 1.1em; }
  :fullscreen .reveal-card,
  :-webkit-full-screen .reveal-card { padding: 60px 40px; min-height: 400px; }
  :fullscreen header h1,
  :-webkit-full-screen header h1 { font-size: 3.2rem; }

  /* ─── Misc ─── */
  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 0;
  }
</style>
</head>
<body>

<header>
  <h1>⚽ World Cup 2026 Sweepstake</h1>
  <p>Fair draw · Live reveal · 48 teams</p>
</header>

<!-- ════════════════════════════════════════
     SCREEN 1 — SETUP
════════════════════════════════════════ -->
<section id="screen-setup" class="screen active">
  <div class="card">
    <h2>Enter Players</h2>
    <textarea id="player-input"
      placeholder="Enter player names separated by commas or new lines&#10;e.g.  David, Sarah, James&#10;or one per line"
      rows="7"></textarea>
    <div class="error-msg" id="setup-error"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-primary" onclick="generateDraw()">Generate Draw</button>
    </div>
  </div>
</section>

<!-- ════════════════════════════════════════
     SCREEN 2 — REVEAL
════════════════════════════════════════ -->
<section id="screen-reveal" class="screen">
  <div class="pot-indicator" id="pot-indicator">Pot 1 of 6</div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progress-label">0 / 48 revealed</div>

  <div class="anim-picker">
    <span>Transition:</span>
    <button class="anim-btn" data-anim="scale" onclick="setAnim('scale')">Scale</button>
    <button class="anim-btn" data-anim="slide" onclick="setAnim('slide')">Slide</button>
    <button class="anim-btn" data-anim="wipe" onclick="setAnim('wipe')">Wipe</button>
    <button class="anim-btn" data-anim="fade" onclick="setAnim('fade')">Fade</button>
  </div>

  <div class="flip-card-wrap">
    <div class="reveal-card" id="reveal-card" onclick="handleRevealClick()">
      <span class="spotlight-badge">⭐ Final Pot — Strongest Teams</span>
      <div class="reveal-placeholder">🏆</div>
      <div class="reveal-hint">Click to begin the draw</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="btn-reveal" onclick="handleRevealClick()">Reveal Next</button>
    <button class="btn btn-ghost" onclick="toggleFullscreen()">⛶ Fullscreen</button>
    <button class="btn btn-danger" onclick="startNewDraw()">↺ New Draw</button>
  </div>
</section>

<!-- ════════════════════════════════════════
     SCREEN 3 — RESULTS
════════════════════════════════════════ -->
<section id="screen-results" class="screen">
  <div class="results-banner">
    <h2>Draw Complete!</h2>
    <p>All 48 teams have been allocated</p>
  </div>

  <div class="results-grid" id="results-grid"></div>

  <div class="btn-row" style="justify-content:center">
    <button class="btn btn-danger" onclick="startNewDraw()">↺ Start New Draw</button>
  </div>
</section>

<script>
// ══════════════════════════════════════════════════════════════════
//  TEAMS DATA — ordered strongest → weakest (ELO-based approximation)
//  48 qualified FIFA World Cup 2026 teams
// ══════════════════════════════════════════════════════════════════
const TEAMS = [
  // Pot 1 — Elite
  { name: "France",           flag: "🇫🇷" },
  { name: "Spain",            flag: "🇪🇸" },
  { name: "Argentina",        flag: "🇦🇷" },
  { name: "England",          flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿" },
  { name: "Brazil",           flag: "🇧🇷" },
  { name: "Germany",          flag: "🇩🇪" },
  { name: "Portugal",         flag: "🇵🇹" },
  { name: "Netherlands",      flag: "🇳🇱" },
  // Pot 2
  { name: "Belgium",          flag: "🇧🇪" },
  { name: "Croatia",          flag: "🇭🇷" },
  { name: "Morocco",          flag: "🇲🇦" },
  { name: "Colombia",         flag: "🇨🇴" },
  { name: "Uruguay",          flag: "🇺🇾" },
  { name: "Japan",            flag: "🇯🇵" },
  { name: "United States",    flag: "🇺🇸" },
  { name: "Mexico",           flag: "🇲🇽" },
  // Pot 3
  { name: "Switzerland",      flag: "🇨🇭" },
  { name: "Senegal",          flag: "🇸🇳" },
  { name: "Turkey",           flag: "🇹🇷" },
  { name: "Iran",             flag: "🇮🇷" },
  { name: "Ecuador",          flag: "🇪🇨" },
  { name: "Austria",          flag: "🇦🇹" },
  { name: "Norway",           flag: "🇳🇴" },
  { name: "South Korea",      flag: "🇰🇷" },
  // Pot 4
  { name: "Sweden",           flag: "🇸🇪" },
  { name: "Czechia",          flag: "🇨🇿" },
  { name: "Australia",        flag: "🇦🇺" },
  { name: "Egypt",            flag: "🇪🇬" },
  { name: "Ivory Coast",      flag: "🇨🇮" },
  { name: "Scotland",         flag: "🏴󠁧󠁢󠁳󠁣󠁴󠁿" },
  { name: "Paraguay",         flag: "🇵🇾" },
  { name: "Algeria",          flag: "🇩🇿" },
  // Pot 5
  { name: "Ghana",            flag: "🇬🇭" },
  { name: "Tunisia",          flag: "🇹🇳" },
  { name: "Canada",           flag: "🇨🇦" },
  { name: "Bosnia & Herz.",   flag: "🇧🇦" },
  { name: "Saudi Arabia",     flag: "🇸🇦" },
  { name: "DR Congo",         flag: "🇨🇩" },
  { name: "South Africa",     flag: "🇿🇦" },
  { name: "Panama",           flag: "🇵🇦" },
  // Pot 6 — Minnows
  { name: "Qatar",            flag: "🇶🇦" },
  { name: "Iraq",             flag: "🇮🇶" },
  { name: "Uzbekistan",       flag: "🇺🇿" },
  { name: "Jordan",           flag: "🇯🇴" },
  { name: "New Zealand",      flag: "🇳🇿" },
  { name: "Cape Verde",       flag: "🇨🇻" },
  { name: "Haiti",            flag: "🇭🇹" },
  { name: "Curaçao",          flag: "🇨🇼" },
];

const GROUP_SIZE = 8;
const STORAGE_KEY = "world-cup-sweepstake-v3";

// ══════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════
let state = {
  allocations: null,   // { playerName: [{name, flag, teamIndex}, ...] }
  revealQueue: [],     // [{ country, flag, owner, groupIndex, totalGroups }]
  revealIndex: 0,      // which item in revealQueue we're showing
  revealStage: 0,      // 0 = pre, 1 = country shown, 2 = owner shown
};

// ══════════════════════════════════════════════════════════════════
//  UTILITIES
// ══════════════════════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parsePlayers(raw) {
  return raw
    .split(/[\n,]+/)
    .map(s => s.trim())
    .filter(Boolean)
    .filter((v, i, a) => a.indexOf(v) === i); // deduplicate
}

// ══════════════════════════════════════════════════════════════════
//  ALLOCATION
//
//  Strategy: split teams into bands of exactly `n` (one per player),
//  shuffle each band independently, then assign band[0]→player[0] etc.
//  This guarantees balanced distribution (one team per band per player)
//  while randomising *which* team from each band each player receives,
//  so pairings like France+Bosnia never repeat across draws.
// ══════════════════════════════════════════════════════════════════
function allocate(players) {
  const shuffledPlayers = shuffle(players);
  const n = shuffledPlayers.length;
  const alloc = {};
  shuffledPlayers.forEach(p => { alloc[p] = []; });

  // Walk through TEAMS in bands of n, shuffling each band before assigning
  for (let start = 0; start < TEAMS.length; start += n) {
    // Tag each team with its original index before shuffling
    const band = TEAMS.slice(start, start + n).map((team, offset) => ({
      ...team, teamIndex: start + offset,
    }));
    const shuffledBand = shuffle(band);
    shuffledBand.forEach((team, j) => {
      // Teams at the tail of the last band wrap back around to earlier players
      const player = shuffledPlayers[j % n];
      alloc[player].push({ name: team.name, flag: team.flag, teamIndex: team.teamIndex });
    });
  }

  return alloc;
}

// ══════════════════════════════════════════════════════════════════
//  REVEAL QUEUE CONSTRUCTION
// ══════════════════════════════════════════════════════════════════
function buildRevealQueue(allocations) {
  // Build (teamIndex → owner) map
  const ownerMap = {};
  for (const [player, teams] of Object.entries(allocations)) {
    for (const t of teams) ownerMap[t.teamIndex] = player;
  }

  const totalGroups = Math.ceil(TEAMS.length / GROUP_SIZE);

  // Split TEAMS into groups of GROUP_SIZE (strongest first)
  const groups = [];
  for (let g = 0; g < totalGroups; g++) {
    const start = g * GROUP_SIZE;
    const members = TEAMS.slice(start, start + GROUP_SIZE).map((t, offset) => ({
      country: t.name,
      flag: t.flag,
      owner: ownerMap[start + offset],
      groupIndex: g,
      totalGroups,
    }));
    groups.push(members);
  }

  // Reverse: weakest group first; shuffle within each group
  const queue = [];
  for (let g = totalGroups - 1; g >= 0; g--) {
    queue.push(...shuffle(groups[g]));
  }

  return queue;
}

// ══════════════════════════════════════════════════════════════════
//  PERSISTENCE
// ══════════════════════════════════════════════════════════════════
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) { /* ignore quota errors */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    state = saved;
    return true;
  } catch (e) {
    return false;
  }
}

// ══════════════════════════════════════════════════════════════════
//  SCREEN MANAGEMENT
// ══════════════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ══════════════════════════════════════════════════════════════════
//  SETUP → GENERATE DRAW
// ══════════════════════════════════════════════════════════════════
function generateDraw() {
  const raw = document.getElementById("player-input").value;
  const players = parsePlayers(raw);
  const err = document.getElementById("setup-error");

  if (players.length < 2) {
    err.textContent = "Please enter at least 2 player names.";
    return;
  }
  err.textContent = "";

  state.allocations = allocate(players);
  state.revealQueue = buildRevealQueue(state.allocations);
  state.revealIndex = 0;
  state.revealStage = 0;

  saveState();
  enterRevealScreen();
}

// ══════════════════════════════════════════════════════════════════
//  REVEAL SCREEN ENTRY
// ══════════════════════════════════════════════════════════════════
function enterRevealScreen() {
  showScreen("screen-reveal");
  renderRevealIdle();
  updateRevealProgress();
}

function renderRevealIdle() {
  const card = document.getElementById("reveal-card");
  card.classList.remove("spotlight-card");
  card.innerHTML = `
    <span class="spotlight-badge">⭐ Final Pot — Strongest Teams</span>
    <div class="reveal-placeholder">🏆</div>
    <div class="reveal-hint">Click to begin the draw</div>
  `;
  document.getElementById("pot-indicator").textContent = "";
}

function updateRevealProgress() {
  const total = state.revealQueue.length;
  const done = Math.max(0, state.revealIndex - (state.revealStage > 0 ? 0 : 0));
  const pct = total > 0 ? (state.revealIndex / total) * 100 : 0;
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-label").textContent =
    `${state.revealIndex} / ${total} revealed`;
}

// ══════════════════════════════════════════════════════════════════
//  REVEAL CLICK HANDLER  (State Machine)
//
//  revealStage:
//    0 → click → show country (stage becomes 1)
//    1 → click → show owner   (stage becomes 2)
//    2 → click → advance to next, show country (stage becomes 1)
// ══════════════════════════════════════════════════════════════════
let _flipping = false;
let _anim = 'scale'; // scale | slide | wipe | fade

const ANIM_DURATIONS = { scale: 220, slide: 220, wipe: 280, fade: 180 };

function setAnim(name) {
  _anim = name;
  document.querySelectorAll('.anim-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.anim === name);
  });
  try { localStorage.setItem('wc-anim', name); } catch(e) {}
}

function initAnim() {
  const saved = localStorage.getItem('wc-anim');
  setAnim(['scale','slide','wipe','fade'].includes(saved) ? saved : 'scale');
}

function handleRevealClick() {
  if (_flipping) return;
  if (!state.allocations) return;

  const q = state.revealQueue;
  const total = q.length;

  if (state.revealIndex >= total && state.revealStage >= 2) {
    showResults();
    return;
  }

  if (state.revealStage === 0) {
    // First click ever — show first country
    flipTo(() => showCountry(q[state.revealIndex]));
    state.revealStage = 1;
  } else if (state.revealStage === 1) {
    // Show owner for current item — fade in, no flip
    showOwner(q[state.revealIndex]);
    state.revealStage = 2;
  } else if (state.revealStage === 2) {
    // Advance
    state.revealIndex++;
    if (state.revealIndex >= total) {
      saveState();
      showResults();
      return;
    }
    state.revealStage = 1;
    flipTo(() => showCountry(q[state.revealIndex]));
  }

  updateRevealProgress();
  saveState();
}

function flipTo(renderFn) {
  const card = document.getElementById("reveal-card");
  const exitClass = 'anim-exit-' + _anim;
  const duration = ANIM_DURATIONS[_anim] ?? 220;
  _flipping = true;
  card.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease, clip-path ${duration}ms ease`;
  card.classList.add(exitClass);
  setTimeout(() => {
    renderFn();
    card.classList.remove(exitClass);
    // brief pause so browser registers the class removal before re-enabling pointer
    setTimeout(() => { _flipping = false; }, 50);
  }, duration);
}

function showCountry(item) {
  const card = document.getElementById("reveal-card");
  const isSpotlight = item.groupIndex === 0; // groupIndex 0 = strongest group

  card.className = "reveal-card" + (isSpotlight ? " spotlight-card" : "");
    card.innerHTML = `
      <span class="spotlight-badge">⭐ Final Pot — Strongest Teams</span>
      <div class="reveal-flag">${item.flag}</div>
      <div class="reveal-country">${item.country}</div>
      <div class="owner-wrap">
        <div class="owner-redacted"></div>
        <div class="owner-name" aria-hidden="true">${escHtml(item.owner)}</div>
      </div>
      <div class="reveal-hint">Click to reveal owner</div>
    `;

  updatePotIndicator(item);
}

function showOwner(item) {
  const card = document.getElementById("reveal-card");
  const isSpotlight = item.groupIndex === 0;

  // Keep the card stable — just unblur the existing owner element in-place
  card.className = "reveal-card" + (isSpotlight ? " spotlight-card" : "");

  const ownerWrap = card.querySelector(".owner-wrap");
  if (ownerWrap) {
    ownerWrap.classList.add("revealed");
    const nameEl = ownerWrap.querySelector(".owner-name");
    if (nameEl) nameEl.removeAttribute("aria-hidden");
  }

  const hintEl = card.querySelector(".reveal-hint");
  if (hintEl) hintEl.textContent = "Click for next team";

  updatePotIndicator(item);
}

function updatePotIndicator(item) {
  const el = document.getElementById("pot-indicator");
  const total = item.totalGroups;
  // groups are revealed weakest-first → groupIndex 0 is revealed last
  // displayed pot number = total - groupIndex
  const potNumber = total - item.groupIndex;

  if (item.groupIndex === 0) {
    el.textContent = "⭐ FINAL POT — STRONGEST TEAMS";
    el.classList.add("spotlight");
  } else {
    el.textContent = `Pot ${potNumber} of ${total}`;
    el.classList.remove("spotlight");
  }
}

// ══════════════════════════════════════════════════════════════════
//  RESULTS SCREEN
// ══════════════════════════════════════════════════════════════════
function showResults() {
  renderResults();
  showScreen("screen-results");
}

function renderResults() {
  const grid = document.getElementById("results-grid");
  const alloc = state.allocations;

  // Sort players by their best team (lowest teamIndex = strongest)
  const players = Object.keys(alloc).sort((a, b) => {
    const bestA = Math.min(...alloc[a].map(t => t.teamIndex));
    const bestB = Math.min(...alloc[b].map(t => t.teamIndex));
    return bestA - bestB;
  });

  grid.innerHTML = players.map((player, rank) => {
    const teams = [...alloc[player]].sort((a, b) => a.teamIndex - b.teamIndex);
    return `
      <div class="player-card">
        <div class="player-rank">#${rank + 1}</div>
        <div class="player-name">${escHtml(player)}</div>
        <ul class="team-list">
          ${teams.map(t => `
            <li>
              <span class="flag">${t.flag}</span>
              <span class="name">${escHtml(t.name)}</span>
              <span class="rank-badge">#${t.teamIndex + 1}</span>
            </li>
          `).join("")}
        </ul>
      </div>
    `;
  }).join("");
}

// ══════════════════════════════════════════════════════════════════
//  FULLSCREEN
// ══════════════════════════════════════════════════════════════════
function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)
      .call(document.documentElement);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}

// ══════════════════════════════════════════════════════════════════
//  START NEW DRAW
// ══════════════════════════════════════════════════════════════════
function startNewDraw() {
  if (!confirm("Start a new draw? This will clear the current draw.")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = { allocations: null, revealQueue: [], revealIndex: 0, revealStage: 0 };
  document.getElementById("player-input").value = "";
  document.getElementById("setup-error").textContent = "";
  showScreen("screen-setup");
}

// ══════════════════════════════════════════════════════════════════
//  SECURITY UTIL
// ══════════════════════════════════════════════════════════════════
function escHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ══════════════════════════════════════════════════════════════════
//  INIT — Restore saved state on page load
// ══════════════════════════════════════════════════════════════════
(function init() {
  initAnim();
  if (loadState() && state.allocations) {
    if (state.revealIndex >= state.revealQueue.length && state.revealStage >= 2) {
      // Draw was complete
      showResults();
    } else {
      // Resume reveal
      enterRevealScreen();
      if (state.revealIndex > 0 || state.revealStage > 0) {
        const q = state.revealQueue;
        const idx = Math.min(state.revealIndex, q.length - 1);
        const item = q[idx];
        if (state.revealStage === 2) {
          showOwner(item);
        } else if (state.revealStage === 1) {
          showCountry(item);
        }
        updateRevealProgress();
        updatePotIndicator(item);
      }
    }
  }
})();
</script>
